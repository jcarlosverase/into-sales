# ============================================================
# IntoSales — Ruta B: app + Postgres + Caddy (HTTPS automático)
# Uso:        pnpm init-env --domain tu.dominio  →  pnpm doctor  →  docker compose up -d
#             (sin Node: cp .env.example .env y rellenar a mano)
# Actualizar: git pull  →  docker compose up -d
#
# La app sale de la imagen publicada de la versión (una por tag vX.Y.Z). Con
# `image` y `build` juntos y sin `pull_policy`, Compose intenta primero
# descargar la imagen y solo la construye desde este repo si no la encuentra
# ni en el registro ni en tu máquina (especificación de Compose, «Using build
# and image»: docs.docker.com/reference/compose-file/build/):
#
#   docker compose up -d           la imagen publicada
#   docker compose up -d --build   construida desde el código (la publicada
#                                  es linux/amd64: en un VPS ARM, construye)
#
# Lo que construyes queda en tu máquina con este mismo nombre de imagen. En un
# fork con cambios propios usa siempre --build (o cambia `image:` por un
# nombre tuyo): sin él, Compose puede correr la imagen oficial en vez de tus
# cambios. Otra versión publicada: INTO_SALES_VERSION=X.Y.Z en tu .env.
# ============================================================

# Spec 1006: Docker keeps each container's log in a file that, by default,
# never stops growing. Three files of 10 MB per container at most.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ghcr.io/jcarlosverase/into-sales:${INTO_SALES_VERSION:-1.5.0}
    build: .
    restart: unless-stopped
    environment:
      APP_BASE_URL: ${APP_BASE_URL}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/into_sales
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v25.0}
      OPENROUTER_API_TOKEN: ${OPENROUTER_API_TOKEN:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_JUDGE_MODEL: ${OPENROUTER_JUDGE_MODEL:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-}
      AGENT_COALESCE_MS: ${AGENT_COALESCE_MS:-6000}
      # Opcionales: vacías = apagadas (guía de cada una en .env.example).
      CHANNELS: ${CHANNELS:-}
      AGENDA: ${AGENDA:-}
      ATRIBUCION: ${ATRIBUCION:-}
      BOT_API_KEY: ${BOT_API_KEY:-}
      BRAIN_HEALTH_URL: ${BRAIN_HEALTH_URL:-}
      BRAIN_DISPATCH_URL: ${BRAIN_DISPATCH_URL:-}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      # Latido al servicio central de into (spec 028); vacía = apagado.
      INTO_CENTRAL_URL: ${INTO_CENTRAL_URL:-}
      # Observability (spec 1006): level of the JSON logs and token of
      # /api/metrics (blank = the route does not exist).
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    logging: *logging
    volumes:
      # Adjuntos, logo e icono (la imagen ya trae MEDIA_DIR=/data/media): sin
      # este volumen se pierden al recrear el contenedor.
      - sales_app_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    # el HEALTHCHECK vive en el Dockerfile (/api/health)

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: into_sales
      # Hora de Lima (UTC-5) para el servidor y quien abra la base; las fechas son
      # timestamptz y guardan el instante, así que esto solo cambia cómo se ven.
      TZ: America/Lima
      PGTZ: America/Lima
    volumes:
      - sales_pg:/var/lib/postgresql/data
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d into_sales"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - sales_caddy_data:/data
      - sales_caddy_config:/config
    logging: *logging
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  sales_pg:
  sales_app_data:
  sales_caddy_data:
  sales_caddy_config:

# Postgres local para desarrollo en el puerto 5433 (el 5432 queda para
# into-central). Uso: docker compose -f docker-compose.dev.yml up -d
# `name` propio: evita colisionar con el proyecto del docker-compose.yml (Ruta B).
name: into-sales-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: into_sales
      # Hora de Lima (UTC-5) para el servidor y quien abra la base; las fechas son
      # timestamptz y guardan el instante, así que esto solo cambia cómo se ven.
      TZ: America/Lima
      PGTZ: America/Lima
    ports:
      - "5433:5432"
    volumes:
      - sales_dev_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d into_sales"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sales_dev_pg:
